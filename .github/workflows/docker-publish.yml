name: Build and publish Docker image

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: planner77/layoutmanager

jobs:
  build-and-push:
    name: Build and push to GHCR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # v1.2.3 형태의 릴리스 태그를 사용할 때는
      # src/package.json의 애플리케이션 버전과 태그 버전이 같아야만 게시한다.
      - name: Validate release tag against package version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail
          APP_VERSION="$(node -p "require('./src/package.json').version")"
          TAG_VERSION="${GITHUB_REF_NAME#v}"

          if [ "$APP_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Release tag version ($TAG_VERSION) does not match src/package.json version ($APP_VERSION)."
            exit 1
          fi

          echo "Validated release version: $TAG_VERSION"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # main push  -> ghcr.io/planner77/layoutmanager:main
      # v0.19.2    -> ghcr.io/planner77/layoutmanager:0.19.2
      #               ghcr.io/planner77/layoutmanager:latest
      - name: Generate Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
          labels: |
            org.opencontainers.image.title=Layout Manager
            org.opencontainers.image.description=CAD Layout Manager
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./src/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Show published image digest
        shell: bash
        run: |
          echo "Published tags:"
          echo '${{ steps.meta.outputs.tags }}'
          echo "Digest: ${{ steps.build.outputs.digest }}"
