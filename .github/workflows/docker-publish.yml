name: Build and publish Docker image

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  packages: write

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: planner77/layoutmanager

jobs:
  build-and-push:
    name: Build and push to GHCR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read application version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          APP_VERSION="$(node -p "require('./src/package.json').version")"
          echo "version=$APP_VERSION" >> "$GITHUB_OUTPUT"
          echo "Application version: $APP_VERSION"

      # v1.2.3 형태의 릴리스 태그를 사용할 때는
      # src/package.json의 애플리케이션 버전과 태그 버전이 같아야만 게시한다.
      - name: Validate release tag against package version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail
          APP_VERSION='${{ steps.version.outputs.version }}'
          TAG_VERSION="${GITHUB_REF_NAME#v}"

          if [ "$APP_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Release tag version ($TAG_VERSION) does not match src/package.json version ($APP_VERSION)."
            exit 1
          fi

          echo "Validated release version: $TAG_VERSION"

      # main에서 package.json 버전에 해당하는 태그가 아직 없으면 현재 커밋에 생성한다.
      # GITHUB_TOKEN으로 생성한 태그 push는 별도 workflow를 재귀 실행하지 않으므로,
      # 같은 main 실행에서 정식 버전 이미지 게시까지 처리한다.
      - name: Create release tag from package version
        id: release_tag
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          TAG="v${APP_VERSION}"

          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "Release tag ${TAG} already exists."
            echo "created=false" >> "$GITHUB_OUTPUT"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" -m "Release ${TAG}"
            git push origin "$TAG"
            echo "created=true" >> "$GITHUB_OUTPUT"
            echo "Created release tag ${TAG} at ${GITHUB_SHA}."
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # main에서 같은 버전 태그가 이미 존재하더라도 이미지 게시가 중간에 실패했을 수 있으므로
      # GHCR에 실제 버전 이미지가 있는지 확인한다.
      - name: Check version image on GHCR
        id: release_image
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          IMAGE="${REGISTRY}/${IMAGE_NAME}:${APP_VERSION}"
          if docker buildx imagetools inspect "$IMAGE" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Version image already exists: $IMAGE"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Version image does not exist yet: $IMAGE"
          fi

      - name: Decide whether to publish
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          SHOULD_PUBLISH=false

          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            SHOULD_PUBLISH=true
          elif [[ "${GITHUB_REF}" == "refs/heads/main" ]]; then
            if [[ "${{ steps.release_tag.outputs.created }}" == "true" || "${{ steps.release_image.outputs.exists }}" != "true" ]]; then
              SHOULD_PUBLISH=true
            fi
          fi

          echo "publish=$SHOULD_PUBLISH" >> "$GITHUB_OUTPUT"
          echo "Publish version image: $SHOULD_PUBLISH"

      # 게시되는 Docker 태그는 정식 버전과 latest뿐이다.
      # main 브랜치용 :main 이미지는 만들지 않는다.
      - name: Generate Docker metadata
        id: meta
        if: steps.publish.outputs.publish == 'true'
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.version.outputs.version }},enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=Layout Manager
            org.opencontainers.image.description=CAD Layout Manager
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}

      - name: Build and push Docker image
        id: build
        if: steps.publish.outputs.publish == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./src/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Show published image digest
        if: steps.publish.outputs.publish == 'true'
        shell: bash
        run: |
          echo "Published tags:"
          echo '${{ steps.meta.outputs.tags }}'
          echo "Digest: ${{ steps.build.outputs.digest }}"

      - name: Skip duplicate version build
        if: steps.publish.outputs.publish != 'true'
        shell: bash
        run: |
          echo "The release tag and GHCR version image already exist. No Docker image was built for this main push."
