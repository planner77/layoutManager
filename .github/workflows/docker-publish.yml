name: Main CI and conditional Docker publish
# For one-line squash subjects use "#<issue> | short description".
# The push event head_commit.message contains the FULL commit body, not just its subject.
# Expressions in run-name cannot split strings or use step outputs.
# A multiline message must never become an unbounded Actions run title.
# The normal resolution is repo squash settings PR_TITLE + BLANK (see out/Issue74.md).
run-name: >-
  ${{ startsWith(github.ref, 'refs/tags/v')
      && format('RELEASE | NO-ISSUE | {0} GHCR 이미지 게시', github.ref_name)
      || (contains(github.event.head_commit.message || '', fromJSON('"\n"'))
          && format('MAIN CI | SUBJECT-ONLY-REQUIRED | run {0}', github.run_number)
          || ((startsWith(github.event.head_commit.message, '#') || startsWith(github.event.head_commit.message, 'NO-ISSUE |'))
              && format('MAIN CI | {0}', github.event.head_commit.message)
              || format('MAIN CI | ISSUE-UNKNOWN | {0}', github.event.head_commit.message || github.sha))) }}

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  packages: write

concurrency:
  # Serialize releases: cancellation during paired alias promotion is unsafe.
  group: docker-publish-release
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: planner77/layoutmanager

jobs:
  # Always run on main. This makes a metadata-only merge produce a successful
  # Main CI run without creating/moving any GHCR image tag.
  release-scope:
    name: Main CI - verify release scope
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      publish: ${{ steps.scope.outputs.publish }}
    steps:
      - name: Checkout revisions
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check changed paths before GHCR publication
        id: scope
        shell: bash
        env:
          EVENT_BEFORE: ${{ github.event.before }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          publish=true
          reason="Tagged release or runtime-affecting main change"
          if [[ "$GITHUB_REF" == "refs/heads/main" ]]; then
            # Do not guess if the push baseline is missing: block release
            # rather than risk an unintended GHCR publish.
            BEFORE="${EVENT_BEFORE:-}"
            if [[ "$BEFORE" =~ ^[0-9a-f]{40}$ ]] &&
               [[ ! "$BEFORE" =~ ^0+$ ]] &&
               git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
              git diff --name-only -z "$BEFORE" "$GITHUB_SHA" -- > "$RUNNER_TEMP/changed-files"
              mapfile -d '' -t changed < "$RUNNER_TEMP/changed-files"
              if (( ${#changed[@]} > 0 )); then
                publish=false
                reason="Only documentation/workflow metadata changed"
                for file in "${changed[@]}"; do
                  case "$file" in
                    *.md|.github/workflows/*.yml|.github/workflows/*.yaml) ;;
                    *)
                      publish=true
                      reason="Runtime-affecting change detected: $file"
                      break
                      ;;
                  esac
                done
              else
                publish=false
                reason="Empty diff: no release-relevant change"
              fi
            else
              echo "::error::Cannot verify main diff baseline; refusing GHCR publication"
              exit 1
            fi
          fi
          # #109 S1: exact first-line subject only; allow multiline squash body.
          COMMIT_SUBJECT="$(sed -n '1p' <<< "$COMMIT_MESSAGE")"
          if [[ "$GITHUB_REF" == "refs/heads/main" &&
                "$COMMIT_SUBJECT" == "#109 | S1 Staging-only integration [G7-S1-NO-GHCR]" ]]; then
            for file in "${changed[@]}"; do
              case "$file" in
                *.md|.github/workflows/docker-publish.yml|src/app/api/g7-staging/*|src/deploy/g7-staging/*|src/server/g7-staging/*|src/scripts/g7-staging-*.ts|src/tests/unit/g7-staging-*.test.ts|src/tests/integration/g7-staging.test.ts)
                  ;;
                *)
                  echo "::error::G7-S1 GHCR exclusion disallowed path: $file" >&2
                  exit 1
                  ;;
              esac
            done
            publish=false
            reason="Explicit approved G7 S1 staging-only change: skip GHCR publishing"
          elif [[ "$GITHUB_REF" == "refs/heads/main" &&
                  "$COMMIT_SUBJECT" == "#109 | S2 private-evidence readiness [G7-S2-NO-GHCR]" ]]; then
            # S2 is an OFFLINE evidence readiness tool, NOT operational CAD cutover.
            # Explicit path allowlist: no wildcard staging/runtime or arbitrary docs.
            for file in "${changed[@]}"; do
              case "$file" in
                .github/workflows/docker-publish.yml|AGENTS.md|out/Decisions.md|out/FailureLedger.md|out/Issue109-S2-Readiness.md|out/Issue109.md|out/Operation.md|out/Requirements.md|out/TestPlan.md|out/TestReport.md|src/scripts/g7-s2-readiness.ts|src/server/g7-staging/s2-readiness.ts|src/tests/unit/g7-s2-readiness.test.ts|src/tests/unit/g7-staging-ghcr-guard.test.ts)
                  ;;
                *)
                  echo "::error::G7-S2 GHCR exclusion disallowed path: $file" >&2
                  exit 1
                  ;;
              esac
            done
            publish=false
            reason="Explicit approved G7 S2 private-evidence readiness only: skip GHCR publishing"
          elif [[ "$GITHUB_REF" == "refs/heads/main" &&
                  "$COMMIT_SUBJECT" == "#109 | S3-1 Operational schema and gates [G7-S3-1-NO-GHCR]" ]]; then
            # S3-1 prepares operational TYPES and a DISPOSABLE migration candidate.
            # Explicit, reviewed paths only; production migration history remains unchanged.
            for file in "${changed[@]}"; do
              case "$file" in
                .github/workflows/docker-publish.yml|AGENTS.md|out/Architecture.md|out/Database.md|out/Decisions.md|out/FailureLedger.md|out/Issue109.md|out/Operation.md|out/Requirements.md|out/TestPlan.md|out/TestReport.md|src/prisma/schema.prisma|src/deploy/g7-s3/README.md|src/deploy/g7-s3/prisma.config.ts|src/deploy/g7-s3/prisma/migrations/migration_lock.toml|src/deploy/g7-s3/prisma/migrations/202609070001_locations/migration.sql|src/deploy/g7-s3/prisma/migrations/202609090001_description/migration.sql|src/deploy/g7-s3/prisma/migrations/202609110001_delete_password/migration.sql|src/deploy/g7-s3/prisma/migrations/202609110002_delete_invariants/migration.sql|src/deploy/g7-s3/prisma/migrations/202609110003_drawing_name/migration.sql|src/deploy/g7-s3/prisma/migrations/202610150001_master_hierarchy/migration.sql|src/deploy/g7-s3/prisma/migrations/202610260002_g7_operational_auth/migration.sql|src/server/g7-operational/preflight.ts|src/tests/unit/g7-s3-operational-gate.test.ts|src/tests/integration/g7-s3-operational-migration.test.ts|src/tests/integration/auth-g1.test.ts|src/tests/integration/auth-g2.test.ts|src/tests/integration/auth-g3.test.ts|src/tests/unit/g7-staging-ghcr-guard.test.ts)
                  ;;
                *)
                  echo "::error::G7-S3-1 GHCR exclusion disallowed path: $file" >&2
                  exit 1
                  ;;
              esac
            done
            publish=false
            reason="Approved G7 S3-1 schema/type and disposable migration candidate only: skip GHCR"
          elif [[ "$GITHUB_REF" == "refs/heads/main" &&
                  "$COMMIT_SUBJECT" == "#109 | S3-2 Operational Auth/Admin API [G7-S3-2-NO-GHCR]" ]]; then
            # S3-2 Auth API preview is hard-OFF in production; exact scope ONLY.
            for file in "${changed[@]}"; do
              case "$file" in
                .github/workflows/docker-publish.yml|AGENTS.md|out/Architecture.md|out/Database.md|out/Decisions.md|out/FailureLedger.md|out/Issue109.md|out/Operation.md|out/Requirements.md|out/TestPlan.md|out/TestReport.md|src/deploy/g7-s3/prisma.config.ts|src/deploy/g7-s3/README.md|src/deploy/g7-s3/S3-2.md|src/server/g7-operational/disposable-target.ts|src/server/g7-operational/preview-gate.ts|src/server/g7-operational/preview-db.ts|src/server/g7-operational/preview-handler.ts|src/server/g7-operational/user-provisioning.ts|'src/app/api/g7-operational/[...segments]/route.ts'|src/scripts/g7-s3-admin.ts|src/tests/integration/g7-s3-operational-auth.test.ts|src/tests/unit/g7-staging-ghcr-guard.test.ts)
                  ;;
                *)
                  echo "::error::G7-S3-2 GHCR exclusion disallowed path: $file" >&2
                  exit 1
                  ;;
              esac
            done
            publish=false
            reason="Approved G7 S3-2 nonproduction Auth API preview only: skip GHCR"
          elif [[ "$GITHUB_REF" == "refs/heads/main" &&
                   "$COMMIT_SUBJECT" == "#109 | S3-3 Isolated CAD write and Audit [G7-S3-3-NO-GHCR]" ]]; then
            # Production is OFF. Only the reviewed isolated CAD/Audit diff may skip GHCR.
            for file in "${changed[@]}"; do
              case "$file" in
                .github/workflows/docker-publish.yml|AGENTS.md|out/Architecture.md|out/Database.md|out/FailureLedger.md|out/Issue109.md|out/Operation.md|out/Requirements.md|out/TestPlan.md|out/TestReport.md|src/deploy/g7-s3/S3-3.md|src/server/auth/audit.ts|src/server/g7-operational/cad-guard.ts|src/server/g7-operational/cad-preview-context.ts|src/server/repositories/cad.ts|src/server/services/upload.ts|src/app/api/cad-files/route.ts|'src/app/api/cad-files/[versionId]/route.ts'|'src/app/api/cad-locations/[locationId]/current/route.ts'|src/tests/integration/g7-s3-cad-write.test.ts|src/tests/unit/g7-s3-cad-preview.test.ts|src/tests/unit/g7-staging-ghcr-guard.test.ts)
                  ;;
                *)
                  echo "::error::G7-S3-3 GHCR exclusion disallowed path: $file" >&2
                  exit 1
                  ;;
              esac
            done
            publish=false
            reason="Approved G7 S3-3 disposable CAD integration only: skip GHCR"
          elif [[ "$GITHUB_REF" == "refs/heads/main" &&
                   "$COMMIT_SUBJECT" == "#109 | S3-3"* ]]; then
            echo "::error::G7-S3-3 exact squash subject required" >&2
            exit 1
          elif [[ "$GITHUB_REF" == "refs/heads/main" &&
                  "$COMMIT_SUBJECT" == "#109 | S3-2"* ]]; then
            echo "::error::G7-S3-2 exact squash subject required" >&2
            exit 1
          elif [[ "$GITHUB_REF" == "refs/heads/main" &&
                  "$COMMIT_SUBJECT" == "#109 | S3-1"* ]]; then
            echo "::error::G7-S3-1 exact squash subject required" >&2
            exit 1
          elif [[ "$GITHUB_REF" == "refs/heads/main" &&
                  "$COMMIT_SUBJECT" == "#109 | S2 "* ]]; then
            echo "::error::G7-S2 exact squash subject required" >&2
            exit 1
          elif [[ "$GITHUB_REF" == "refs/heads/main" &&
                  "$COMMIT_SUBJECT" == "#109 | S1 Staging-only integration"* ]]; then
            echo "::error::G7-S1 exact squash subject required" >&2
            exit 1
          fi
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "Release scope: $reason"
          {
            echo "### Main CI / GHCR scope"
            echo "- Decision: $(if [[ "$publish" == "true" ]]; then echo 'Normal release gate'; else echo 'Skip all GHCR publication'; fi)"
            echo "- Reason: $reason"
            echo "- Ref: $GITHUB_REF"
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ "$publish" == "false" ]]; then
            # Scope-validated no-GHCR: docs-only or exact #109 S1/S2/S3-1/S3-2/S3-3 exception.
            # Functional tests must pass on the final PR HEAD before merge.
            test -s .github/workflows/pr-ci.yml
            test -s .github/workflows/docker-publish.yml
            test -s AGENTS.md
          fi

  build-and-push:
    name: Build and push to GHCR
    needs: release-scope
    if: ${{ needs.release-scope.outputs.publish == 'true' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read application version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          APP_VERSION="$(node -p "require('./src/package.json').version")"
          echo "version=$APP_VERSION" >> "$GITHUB_OUTPUT"
          echo "Application version: $APP_VERSION"

      # v1.2.3 형태의 릴리스 태그를 사용할 때는
      # src/package.json의 애플리케이션 버전과 태그 버전이 같아야만 게시한다.
      - name: Validate release tag against package version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail
          APP_VERSION='${{ steps.version.outputs.version }}'
          TAG_VERSION="${GITHUB_REF_NAME#v}"

          if [ "$APP_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Release tag version ($TAG_VERSION) does not match src/package.json version ($APP_VERSION)."
            exit 1
          fi

          echo "Validated release version: $TAG_VERSION"

      # main에서 package.json 버전에 해당하는 태그가 아직 없으면 현재 커밋에 생성한다.
      # GITHUB_TOKEN으로 생성한 태그 push는 별도 workflow를 재귀 실행하지 않으므로,
      # 같은 main 실행에서 정식 버전 이미지 게시까지 처리한다.
      - name: Create release tag from package version
        id: release_tag
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          TAG="v${APP_VERSION}"

          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "Release tag ${TAG} already exists."
            echo "created=false" >> "$GITHUB_OUTPUT"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" -m "Release ${TAG}"
            git push origin "$TAG"
            echo "created=true" >> "$GITHUB_OUTPUT"
            echo "Created release tag ${TAG} at ${GITHUB_SHA}."
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # main에서 같은 버전 태그가 이미 존재하더라도 이미지 게시가 중간에 실패했을 수 있으므로
      # GHCR에 실제 버전 이미지가 있는지 확인한다.
      - name: Check version images on GHCR
        id: release_image
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          IMAGE="${REGISTRY}/${IMAGE_NAME}:${APP_VERSION}"
          MIGRATION_IMAGE="${IMAGE}-migrate"
          if docker buildx imagetools inspect "$IMAGE" >/dev/null 2>&1 &&
             docker buildx imagetools inspect "$MIGRATION_IMAGE" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Both version images already exist: $IMAGE and $MIGRATION_IMAGE"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "App or migration version image is missing; publish both."
          fi

      - name: Decide whether to publish
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          SHOULD_PUBLISH=false

          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            SHOULD_PUBLISH=true
          elif [[ "${GITHUB_REF}" == "refs/heads/main" ]]; then
            if [[ "${{ steps.release_tag.outputs.created }}" == "true" || "${{ steps.release_image.outputs.exists }}" != "true" ]]; then
              SHOULD_PUBLISH=true
            fi
          fi

          echo "publish=$SHOULD_PUBLISH" >> "$GITHUB_OUTPUT"
          echo "Publish version image: $SHOULD_PUBLISH"

      # Public release aliases are :version/:latest and :version-migrate/:latest-migrate.
      # Temporary immutable :build-SHA-* candidate tags are not deployment entry points.
      - name: Generate Docker metadata
        id: meta
        if: steps.publish.outputs.publish == 'true'
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.version.outputs.version }},enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=Layout Manager
            org.opencontainers.image.description=CAD Layout Manager
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}

      - name: Generate migration image metadata
        id: meta_migration
        if: steps.publish.outputs.publish == 'true'
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}-migrate,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}-migrate,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=latest-migrate
          labels: |
            org.opencontainers.image.title=Layout Manager DB migration runner
            org.opencontainers.image.description=Prisma migration and password backfill
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}

      # Build/push candidate digests first. Public release aliases must not be
      # touched if either app or migrator build fails. Candidate SHA tags are
      # intentionally retained as reproducible rollback/audit references.
      - name: Build application candidate
        id: build
        if: steps.publish.outputs.publish == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./src/Dockerfile
          target: runtime
          platforms: linux/amd64
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:build-${{ github.sha }}-app
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build migration candidate
        id: build_migration
        if: steps.publish.outputs.publish == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./src/Dockerfile
          target: migrator
          platforms: linux/amd64
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:build-${{ github.sha }}-migrate
          labels: ${{ steps.meta_migration.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Registry tags cannot be promoted atomically across two manifests.
      # Verify BOTH immutable candidates before touching version/latest,
      # publish the migrator first and the app second, and require paired,
      # version-pinned references for production deployments.
      - name: Promote paired release images after both candidates succeed
        if: steps.publish.outputs.publish == 'true'
        shell: bash
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
          APP_DIGEST: ${{ steps.build.outputs.digest }}
          MIGRATION_DIGEST: ${{ steps.build_migration.outputs.digest }}
        run: |
          set -euo pipefail
          IMAGE="${REGISTRY}/${IMAGE_NAME}"
          for digest in "$APP_DIGEST" "$MIGRATION_DIGEST"; do
            if ! [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "::error::Invalid candidate digest"
              exit 1
            fi
            docker buildx imagetools inspect "$IMAGE@$digest" >/dev/null
          done
          # Public tags are created only after both targets have built and
          # their candidate registry manifests are independently readable.
          docker buildx imagetools create --tag "$IMAGE:${APP_VERSION}-migrate" "$IMAGE@$MIGRATION_DIGEST"
          docker buildx imagetools create --tag "$IMAGE:${APP_VERSION}" "$IMAGE@$APP_DIGEST"
          docker buildx imagetools create --tag "$IMAGE:latest-migrate" "$IMAGE@$MIGRATION_DIGEST"
          docker buildx imagetools create --tag "$IMAGE:latest" "$IMAGE@$APP_DIGEST"
          docker buildx imagetools inspect "$IMAGE:${APP_VERSION}-migrate" >/dev/null
          docker buildx imagetools inspect "$IMAGE:${APP_VERSION}" >/dev/null
          echo "Published version pair: $IMAGE:${APP_VERSION} and $IMAGE:${APP_VERSION}-migrate"
          echo "App digest: $APP_DIGEST"
          echo "Migration digest: $MIGRATION_DIGEST"
          {
            echo "### GHCR paired release ${APP_VERSION}"
            echo "- App: \`$IMAGE@$APP_DIGEST\`"
            echo "- Migrator: \`$IMAGE@$MIGRATION_DIGEST\`"
            echo "- Both candidates verified before public tag promotion (not a cross-tag transaction)."
          } >> "$GITHUB_STEP_SUMMARY"

      # Only published version aliases are measured. OCI index/attestation and
      # shared-layer double-counting are reported separately (not docker-save gzip).
      - name: Measure published linux-amd64 OCI layer bytes for paired version images
        if: steps.publish.outputs.publish == 'true'
        shell: bash
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          IMAGE="${REGISTRY}/${IMAGE_NAME}"
          node src/scripts/measure-ghcr-pair.mjs "$IMAGE:${APP_VERSION}" "$IMAGE:${APP_VERSION}-migrate" "$GITHUB_STEP_SUMMARY"

      - name: Skip duplicate version build
        if: steps.publish.outputs.publish != 'true'
        shell: bash
        run: |
          echo "The release tag and BOTH GHCR images already exist. No Docker image was built for this main push."
