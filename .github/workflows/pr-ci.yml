name: PR CI
# The run title is resolved before jobs start; use the PR title contract
# "#<issue> | short description" (not the GitHub PR number).
run-name: >-
  ${{ github.event_name == 'pull_request'
      && ((startsWith(github.event.pull_request.title, '#') || startsWith(github.event.pull_request.title, 'NO-ISSUE |'))
          && format('PR CI | {0}', github.event.pull_request.title)
          || format('PR CI | ISSUE-UNKNOWN | {0}', github.event.pull_request.title))
      || format('MANUAL CI | {0} | {1}', inputs.issue_ref || 'NO-ISSUE', inputs.run_description || '수동 검증') }}

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      issue_ref:
        description: '연관 Issue 번호(# 포함, 예: #68). 없으면 NO-ISSUE'
        type: string
        required: false
        default: NO-ISSUE
      run_description:
        description: 'Actions 목록에 표시할 짧은 실행 설명'
        type: string
        required: false
        default: 수동 검증

permissions:
  contents: read

concurrency:
  group: pr-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint, test, build, E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        working-directory: src

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4


      # Advisory only until a repository administrator applies Issue #76.
      # Do not mistake an advisory PR CI success for acceptance of the repo setting.
      - name: 'Squash Merge defaults read-only audit (Issue #76; advisory)'
        shell: bash
        env:
          AUDIT_GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          prefix='Issue #76 squash defaults'
          if ! response="$(curl --fail --silent --show-error --retry 2 --connect-timeout 5 --max-time 20 -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' -H "Authorization: Bearer ${AUDIT_GITHUB_TOKEN}" "https://api.github.com/repos/${GITHUB_REPOSITORY}")"; then
            echo "::warning title=${prefix}::REST GET failed; policy is NOT VERIFIED."
            echo "- ${prefix}: API unavailable — **NOT VERIFIED**." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if ! observed="$(jq -er 'if type == "object" then [(if .allow_squash_merge == true then "enabled" elif .allow_squash_merge == false then "disabled" else "unset" end), (.squash_merge_commit_title // "unset"), (.squash_merge_commit_message // "unset")] | join("/") else error("invalid repository response") end' <<< "$response")"; then
            echo "::warning title=${prefix}::Invalid REST response; policy is NOT VERIFIED."
            echo "- ${prefix}: API response invalid — **NOT VERIFIED**." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [[ "$observed" == 'enabled/PR_TITLE/BLANK' ]]; then
            echo "${prefix}: PASS (enabled/PR_TITLE/BLANK)."
            echo "- ${prefix}: **PASS** (enabled/PR_TITLE/BLANK)." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning title=${prefix}::Expected enabled/PR_TITLE/BLANK, observed ${observed}. Administrator must update repository Settings; diagnostic is non-blocking."
            echo "- ${prefix}: **NOT APPLIED** (expected enabled/PR_TITLE/BLANK; observed ${observed}). See Issue #76." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: npm
          cache-dependency-path: src/package-lock.json

      - name: 의존성 설치
        run: npm ci

      - name: Prisma Client 생성
        run: npm run db:generate

      - name: TypeScript 검사
        run: npm run typecheck

      - name: ESLint 검사
        run: npm run lint

      - name: Unit 및 Integration 테스트
        run: npm test
      - name: OCI manifest layer statistics unit tests
        run: node --test scripts/measure-ghcr-pair.check.mjs

      # P5 source CPU evidence: actual 1k/10k/100k synthetic runs, not real DXF acceptance.
      # Private CAD inputs are never uploaded to GitHub CI.
      - name: DXF outline source benchmark (1k 10k 100k synthetic)
        run: npm run test:outline-benchmark

      # run.mjs treats unresolved Webpack import/export warnings as hard failures.
      # This must run BEFORE browser tests and GHCR promotion.
      - name: Production 빌드
        run: npm run build

      - name: Playwright Chromium 설치
        run: npx playwright install --with-deps chromium

      - name: E2E 테스트
        run: npm run test:e2e

      - name: G7 서명 Runtime 로그인·관리·CAD 권한 E2E
        run: npx playwright test --config playwright.g7-runtime.config.ts

      - name: G7 신규설치 최초 관리자 웹 UI E2E (#109)
        run: npx playwright test --config playwright.g7-greenfield.config.ts

      - name: Legacy migration E2E 테스트
        run: npm run test:master-migration

      - name: E2E 실패 결과 업로드
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: src/test-results
          if-no-files-found: ignore
          retention-days: 7

  docker-runtime:
    name: Docker image size, migration and runtime smoke
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout including baseline revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Validate tagless and digest image-pair Compose resolution
        shell: bash
        run: |
          set -euo pipefail
          bash -n src/scripts/compose.sh
          GHCR_IMAGE=ghcr.io/planner77/layoutmanager GHCR_MIGRATION_IMAGE= \
            bash src/scripts/compose.sh .env.example config --format json \
            | python3 -c "import json,sys; s=json.load(sys.stdin)['services']; assert s['app']['image']=='ghcr.io/planner77/layoutmanager:latest'; assert s['migrate']['image']=='ghcr.io/planner77/layoutmanager:latest-migrate'"
          if GHCR_IMAGE=ghcr.io/planner77/layoutmanager@sha256:abc GHCR_MIGRATION_IMAGE= \
            bash src/scripts/compose.sh .env.example --print-images; then
            echo "::error::Digest-pinned app unexpectedly accepted without migrator reference"
            exit 1
          fi
      - name: Check Python audit syntax and synthetic regressions before Docker builds (#67)
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile src/scripts/audit_standalone_layers.py src/scripts/test_audit_standalone_layers.py src/scripts/smoke_web_runtime.py src/scripts/smoke_greenfield_runtime.py
          python3 src/scripts/test_audit_standalone_layers.py
      - name: Build pre-change baseline (same source, original Dockerfile)
        shell: bash
        run: |
          set -euo pipefail
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          if [ -z "$BASE_SHA" ]; then BASE_SHA="$(git rev-parse origin/main)"; fi
          git show "$BASE_SHA:src/Dockerfile" > "$RUNNER_TEMP/issue28-baseline.Dockerfile"
          # The baseline uses the PR's CURRENT source, including the newly added
          # logger relative import. Supply ONLY this required one-file closure to
          # the comparison Dockerfile; otherwise baseline migrator cannot start.
          # Do not bypass its import smoke, size comparison or native DB checks.
          python3 - "$RUNNER_TEMP/issue28-baseline.Dockerfile" <<'PY'
          from pathlib import Path
          import re
          import sys
          baseline = Path(sys.argv[1])
          source = baseline.read_bytes()
          anchor = b"COPY --from=builder /app/src/server/logger.ts ./server/logger.ts\n"
          dependency = b"COPY --from=builder /app/src/server/logging/store.ts ./server/logging/store.ts\n"
          stages = list(re.finditer(rb"(?im)^[ \t]*FROM[ \t]+[^\r\n]+(?:\r?\n|$)", source))
          migrators = [i for i, stage in enumerate(stages)
                       if re.search(rb"(?i)[ \t]+AS[ \t]+migrator[ \t]*(?:\r?\n|$)", stage.group())]
          if len(migrators) != 1:
              raise SystemExit("Baseline migrator stage is missing or ambiguous")
          stage_index = migrators[0]
          start = stages[stage_index].start()
          end = stages[stage_index + 1].start() if stage_index + 1 < len(stages) else len(source)
          # A near-match COPY is not a valid closure. It must not be silently
          # accepted or duplicated under a different destination/stage.
          for line in source.splitlines(keepends=True):
              copy = re.match(rb"(?i)^COPY[ \t]+", line.lstrip())
              if b"server/logger.ts" in line and copy and line != anchor:
                  raise SystemExit("Baseline logger COPY is malformed")
              if b"server/logging/store.ts" in line and copy and line != dependency:
                  raise SystemExit("Baseline store COPY is malformed")
          anchors = list(re.finditer(rb"(?m)^" + re.escape(anchor), source))
          if source.count(anchor) != 1 or len(anchors) != 1 or not (start <= anchors[0].start() < end):
              raise SystemExit("Baseline logger package manifest differs from expected source")
          copies = list(re.finditer(rb"(?m)^" + re.escape(dependency), source))
          count = source.count(dependency)
          if count != len(copies) or count > 1 or count == 1 and not (start <= copies[0].start() < end):
              raise SystemExit("Baseline store COPY is duplicate or outside migrator")
          if count == 0:
              position = anchors[0].end()
              baseline.write_bytes(source[:position] + dependency + source[position:])
          PY
          docker buildx build --load --platform linux/amd64 -f "$RUNNER_TEMP/issue28-baseline.Dockerfile" -t cad-layout-viewer:baseline .
          docker buildx build --load --platform linux/amd64 --target migrator -f "$RUNNER_TEMP/issue28-baseline.Dockerfile" -t cad-layout-viewer:baseline-migrate .
      - name: Build phase1, standalone app and migration targets
        shell: bash
        run: |
          set -euo pipefail
          docker buildx build --load --platform linux/amd64 --target phase1 -f src/Dockerfile -t cad-layout-viewer:phase1 .
          docker buildx build --load --platform linux/amd64 --target runtime -f src/Dockerfile -t cad-layout-viewer:ci .
          docker buildx build --load --platform linux/amd64 --target migrator -f src/Dockerfile -t cad-layout-viewer:ci-migrate .
      - name: Measure 3 image sizes, layers and directories
        run: bash src/scripts/measure-images.sh cad-layout-viewer:baseline cad-layout-viewer:phase1 cad-layout-viewer:ci "$GITHUB_STEP_SUMMARY"
      - name: Verify web layer SHA, native and transition-only size saving (#67)
        shell: bash
        run: |
          set -euo pipefail
          python3 src/scripts/audit_standalone_layers.py cad-layout-viewer:baseline cad-layout-viewer:ci "$GITHUB_STEP_SUMMARY"
      - name: Measure migrator baseline vs dedicated dependency closure
        run: bash src/scripts/measure-migrator.sh cad-layout-viewer:baseline-migrate cad-layout-viewer:ci-migrate "$GITHUB_STEP_SUMMARY"
      - name: Verify migrator packaged files and native dependencies
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --entrypoint sh cad-layout-viewer:ci-migrate -c '
            test "$(id -u)" = 10001
            for f in node_modules/.bin/prisma node_modules/.bin/tsx generated/prisma/client.ts prisma.config.ts prisma/migrations server/db.ts scripts/deploy.ts server/logger.ts server/logging/store.ts server/upload-error-catalog.ts; do
              test -e "$f" || { echo "Missing required migrator file: $f"; exit 1; }
            done
            for f in .next public tests server/repositories node_modules/next node_modules/react node_modules/react-dom node_modules/eslint node_modules/vitest node_modules/@playwright/test node_modules/dxf-viewer node_modules/three-dxf-viewer; do
              test ! -e "$f" || { echo "Unexpected migrator file: $f"; exit 1; }
            done
            node -e "const Db=require(\"better-sqlite3\");new Db(\":memory:\").close()"
            node --import tsx --input-type=module -e "import { writeLog } from \"./server/logger.ts\"; if (typeof writeLog !== \"function\") process.exit(1)"
          '

      - name: Validate nonroot web native SQLite and packaged Prisma client (#67)
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --entrypoint sh cad-layout-viewer:ci -c '
            test "$(id -u)" = 10001
            test -f /app/src/node_modules/better-sqlite3/build/Release/better_sqlite3.node
            node -e "const Db=require(\"better-sqlite3\");new Db(\":memory:\").close()"
            test -f /app/src/server.js
          '
      - name: Confirm failed migration is nonzero before app startup
        run: |
          if docker run --rm -e DATABASE_URL=file:/proc/cad.sqlite -e CAD_STORAGE_PATH=/data/cad cad-layout-viewer:ci-migrate; then
            echo "::error::Unwritable database path unexpectedly passed migration"
            exit 1
          fi
      - name: Reject invalid migrations in a disposable database
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          mkdir -p "$tmp/migrations" "$tmp/data/db" "$tmp/data/cad"
          cp -R src/prisma/migrations/. "$tmp/migrations/"
          mkdir "$tmp/migrations/99999999999999_invalid_ci"
          printf '%s\n' 'THIS IS NOT VALID SQL;' > "$tmp/migrations/99999999999999_invalid_ci/migration.sql"
          chmod 755 "$tmp"
          chmod -R a+rX "$tmp/migrations"
          chmod -R a+rwX "$tmp/data"
          if docker run --rm \
            --mount "type=bind,source=$tmp/migrations,target=/app/src/prisma/migrations,readonly" \
            --mount "type=bind,source=$tmp/data,target=/data" \
            -e DATABASE_URL=file:/data/db/cad.sqlite \
            cad-layout-viewer:ci-migrate; then
            echo "::error::Deliberately invalid migration unexpectedly succeeded"
            exit 1
          fi
          # Above uses a disposable CI directory; never a production DB/CAD volume.
      # A newly started Node server can reset a connection before its listener is ready.
      # curl --retry-connrefused alone does not retry exit 56; retry-all-errors covers it.
      - name: Validate #107 isolated G5 PROD and DEV preview configurations
        shell: bash
        run: |
          set -euo pipefail
          # Config-only: never starts the G5 containers, touches production data or activates auth.
          docker compose -f src/deploy/g5/compose.preview.yml --profile g5-prod config --quiet
          docker compose -f src/deploy/g5/compose.preview.yml --profile g5-dev config --quiet

      - name: Compose Greenfield first run, Admin, CAD, restart persistence
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(python3 -c 'import json;print(json.load(open("src/package.json"))["version"])')"
          export GHCR_IMAGE="cad-layout-viewer:${VERSION}"
          export GHCR_MIGRATION_IMAGE="cad-layout-viewer:${VERSION}-migrate"
          export CAD_DATA_VOLUME_NAME="cad-layout-viewer-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "CAD_DATA_VOLUME_NAME=$CAD_DATA_VOLUME_NAME" >> "$GITHUB_ENV"
          docker tag cad-layout-viewer:ci "$GHCR_IMAGE"
          docker tag cad-layout-viewer:ci-migrate "$GHCR_MIGRATION_IMAGE"
          docker compose --env-file .env.example -f src/docker-compose.yml config --quiet
          docker compose --env-file .env.example -f src/docker-compose.yml up -d --no-build app
          curl --fail --silent --show-error --retry 40 --retry-delay 3 --retry-connrefused --retry-all-errors --connect-timeout 3 --max-time 10 http://localhost:3000/api/health
          # The one-time code is synthetic; never print it in Actions output.
          CODE="$(docker compose --env-file .env.example -f src/docker-compose.yml exec -T app cat /data/db/first-admin.code)"
          G7_CI_FIRST_SETUP_CODE="$CODE" python3 src/scripts/smoke_greenfield_runtime.py create http://localhost:3000 "$RUNNER_TEMP/issue109-crud.json"
          unset CODE
          curl --fail http://localhost:3000/fonts/NanumGothic-Regular.ttf --output /dev/null
          curl --fail http://localhost:3000/fonts/CadKorean.typeface.json --output /dev/null
          curl --fail http://localhost:3000/libredwg/wasm/libredwg-web.wasm --output /dev/null
          docker compose --env-file .env.example -f src/docker-compose.yml stop app
          docker compose --env-file .env.example -f src/docker-compose.yml up --no-build --force-recreate migrate
          docker compose --env-file .env.example -f src/docker-compose.yml up -d --no-build app
          curl --fail --silent --show-error --retry 40 --retry-delay 3 --retry-connrefused --retry-all-errors --connect-timeout 3 --max-time 10 http://localhost:3000/api/health
          python3 src/scripts/smoke_greenfield_runtime.py verify http://localhost:3000 "$RUNNER_TEMP/issue109-crud.json"
      - name: Dump Docker diagnostics and stop without deleting volume
        if: always()
        shell: bash
        env:
          GHCR_IMAGE: cad-layout-viewer:ci
          GHCR_MIGRATION_IMAGE: cad-layout-viewer:ci-migrate
        run: |
          docker compose --env-file .env.example -f src/docker-compose.yml ps || true
          docker compose --env-file .env.example -f src/docker-compose.yml logs --tail 80 || true
          docker compose --env-file .env.example -f src/docker-compose.yml down || true
