name: PR CI
# The run title is resolved before jobs start; use the PR title contract
# "#<issue> | short description" (not the GitHub PR number).
run-name: >-
  ${{ github.event_name == 'pull_request'
      && ((startsWith(github.event.pull_request.title, '#') || startsWith(github.event.pull_request.title, 'NO-ISSUE |'))
          && format('PR CI | {0}', github.event.pull_request.title)
          || format('PR CI | ISSUE-UNKNOWN | {0}', github.event.pull_request.title))
      || format('MANUAL CI | {0} | {1}', inputs.issue_ref || 'NO-ISSUE', inputs.run_description || '수동 검증') }}

on:
  pull_request:
    branches:
      - main
      - 'feat/**'
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      issue_ref:
        description: '연관 Issue 번호(# 포함, 예: #68). 없으면 NO-ISSUE'
        type: string
        required: false
        default: NO-ISSUE
      run_description:
        description: 'Actions 목록에 표시할 짧은 실행 설명'
        type: string
        required: false
        default: 수동 검증

permissions:
  contents: read

concurrency:
  group: pr-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    name: Classify PR scope and audit merge defaults
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      full: ${{ steps.classify.outputs.full }}
      baseline: ${{ steps.classify.outputs.baseline }}
    steps:
      - name: Checkout history for exact PR diff
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check fail-closed scope classifier (#197)
        run: python3 .github/scripts/test_pr_ci_scope.py
      - name: Check Issue #229 persistent release hold
        run: python3 .github/scripts/test_issue229_release_hold.py
      - name: Check Release Finalizer RF-01 exact-source read-only policy
        run: |
          python3 -m py_compile src/tests/oci/release_finalizer.py src/tests/oci/test_release_finalizer.py
          python3 src/tests/oci/test_release_finalizer.py
      - name: Check Release Finalizer RF-02 protected integration, no external writes
        run: |
          python3 -m py_compile src/tests/oci/release_finalizer_integrate.py src/tests/oci/test_release_finalizer_integrate.py
          python3 src/tests/oci/test_release_finalizer_integrate.py
      - name: Check RF-03 exact release plan, independent handoff, live GitHub evidence (GET only)
        run: |
          python3 -m py_compile src/tests/oci/rf03_exact_release.py src/tests/oci/test_rf03_exact_release.py src/tests/oci/rf03_release_handoff.py src/tests/oci/test_rf03_release_handoff.py
          python3 -m py_compile src/tests/oci/rf03_live_evidence.py src/tests/oci/rf03_readback.py src/tests/oci/test_rf03_live_evidence.py
          python3 src/tests/oci/test_rf03_exact_release.py
          python3 src/tests/oci/test_rf03_release_handoff.py
          python3 src/tests/oci/test_rf03_live_evidence.py
          python3 -m py_compile src/tests/oci/rf03_material_preflight.py src/tests/oci/test_rf03_material_preflight.py
          python3 src/tests/oci/test_rf03_material_preflight.py
          python3 -m py_compile src/tests/oci/rf03_oci_readback.py src/tests/oci/test_rf03_oci_readback.py
          python3 src/tests/oci/test_rf03_oci_readback.py
      - name: Check Issue #225 proof contracts without external writes
        run: |
          python3 -m py_compile src/tests/oci/rp-provenance.py src/tests/oci/test_rp_provenance.py src/tests/oci/cp-control-proof.py src/tests/oci/test_cp_control_proof.py src/tests/oci/registry_promotion.py src/tests/oci/test_registry_promotion.py
          python3 src/tests/oci/test_rp_provenance.py
          python3 src/tests/oci/test_cp_control_proof.py
          python3 src/tests/oci/test_registry_promotion.py
          python3 -m py_compile src/tests/oci/rr2-recovery-proof.py src/tests/oci/rr2-timeout-probe.py src/tests/oci/test_rp_execution_fix.py
          python3 src/tests/oci/test_rp_execution_fix.py
          python3 src/tests/oci/test_rr2_cleanup.py
          python3 -m py_compile src/tests/oci/candidate_policy.py src/tests/oci/candidate_registry.py src/tests/oci/candidate_publish.py src/tests/oci/test_candidate_publish.py
          python3 src/tests/oci/test_candidate_publish.py
          python3 -m py_compile src/tests/oci/registry_upload_diagnostic.py src/tests/oci/test_registry_upload_diagnostic.py
          python3 src/tests/oci/test_registry_upload_diagnostic.py
          python3 -m py_compile src/tests/oci/verified_negative.py src/tests/oci/test_verified_negative.py
          python3 src/tests/oci/test_verified_negative.py
          python3 -m py_compile src/tests/oci/promotion_policy.py src/tests/oci/release_promote.py src/tests/oci/test_release_promote.py
          python3 src/tests/oci/test_release_promote.py
          python3 -m py_compile src/tests/oci/or58-proof.py src/tests/oci/test_or58_proof.py
          python3 src/tests/oci/test_or58_proof.py
          node --check src/tests/oci/or58-volume-inspect.mjs
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s src/tests/oci -p 'test_*clone*.py'
          node --test src/tests/oci/dxf-capability-inventory.test.mjs
          node --check src/tests/oci/clone-business-fingerprint.mjs
          node --test src/tests/oci/offline-cpu-primitives.test.mjs
          PYTHONDONTWRITEBYTECODE=1 python3 src/tests/oci/test_offline_cpu_primitives_resource.py
          node --check src/tests/oci/offline-cpu-primitives-browser-entry.mjs
          node --check src/tests/oci/offline-cpu-primitives-browser-server.mjs
          node --check src/tests/oci/offline-cpu-primitives-resource-child.mjs
          node --test src/tests/oci/offline-cpu-styled-primitives.test.mjs
          PYTHONDONTWRITEBYTECODE=1 python3 src/tests/oci/test_offline_cpu_styled_primitives_resource.py
          node --check src/tests/oci/offline-cpu-styled-primitives-browser-entry.mjs
          node --check src/tests/oci/offline-cpu-styled-primitives-browser-server.mjs
          node --check src/tests/oci/offline-cpu-styled-primitives-resource-child.mjs
      - name: Determine required CI scope
        id: classify
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            python3 .github/scripts/pr_ci_scope.py manual /dev/null "$GITHUB_OUTPUT"
          else
            for sha in "$BASE_SHA" "$HEAD_SHA"; do
              if [[ ! "$sha" =~ ^[0-9a-f]{40}$ ]] || ! git cat-file -e "${sha}^{commit}"; then
                echo "::error::PR ref missing; refusing docs-only classification"
                exit 1
              fi
            done
            git diff --no-renames --name-only -z "$BASE_SHA" "$HEAD_SHA" -- > "$RUNNER_TEMP/pr-changed-paths.nul"
            python3 .github/scripts/pr_ci_scope.py pr "$RUNNER_TEMP/pr-changed-paths.nul" "$GITHUB_OUTPUT"
          fi
          echo "## PR CI path scope (#197)" >> "$GITHUB_STEP_SUMMARY"
          grep -E '^(full|baseline)=' "$GITHUB_OUTPUT" >> "$GITHUB_STEP_SUMMARY"

      # Advisory only until a repository administrator applies Issue #76.
      # Do not mistake an advisory PR CI success for acceptance of the repo setting.
      - name: 'Squash Merge defaults read-only audit (Issue #76; advisory)'
        shell: bash
        env:
          AUDIT_GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          prefix='Issue #76 squash defaults'
          if ! response="$(curl --fail --silent --show-error --retry 2 --connect-timeout 5 --max-time 20 -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' -H "Authorization: Bearer ${AUDIT_GITHUB_TOKEN}" "https://api.github.com/repos/${GITHUB_REPOSITORY}")"; then
            echo "::warning title=${prefix}::REST GET failed; policy is NOT VERIFIED."
            echo "- ${prefix}: API unavailable — **NOT VERIFIED**." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if ! observed="$(jq -er 'if type == "object" then [(if .allow_squash_merge == true then "enabled" elif .allow_squash_merge == false then "disabled" else "unset" end), (.squash_merge_commit_title // "unset"), (.squash_merge_commit_message // "unset")] | join("/") else error("invalid repository response") end' <<< "$response")"; then
            echo "::warning title=${prefix}::Invalid REST response; policy is NOT VERIFIED."
            echo "- ${prefix}: API response invalid — **NOT VERIFIED**." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [[ "$observed" == 'enabled/PR_TITLE/BLANK' ]]; then
            echo "${prefix}: PASS (enabled/PR_TITLE/BLANK)."
            echo "- ${prefix}: **PASS** (enabled/PR_TITLE/BLANK)." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning title=${prefix}::Expected enabled/PR_TITLE/BLANK, observed ${observed}. Administrator must update repository Settings; diagnostic is non-blocking."
            echo "- ${prefix}: **NOT APPLIED** (expected enabled/PR_TITLE/BLANK; observed ${observed}). See Issue #76." >> "$GITHUB_STEP_SUMMARY"
          fi

  quality:
    name: Static, unit, benchmark and production build
    needs: scope
    if: needs.scope.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: src
    steps:
      - name: Checkout exact PR revision
        uses: actions/checkout@v4

      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: npm
          cache-dependency-path: src/package-lock.json

      - name: 의존성 설치
        run: npm ci

      - name: OR58 registered schema archive preflight
        run: PYTHONDONTWRITEBYTECODE=1 python3 tests/oci/test_or58_schema.py

      - name: Prisma Client 생성
        run: npm run db:generate

      - name: TypeScript 검사
        run: npm run typecheck

      - name: ESLint 검사
        run: npm run lint

      - name: Unit 및 Integration 테스트
        run: npm test
      - name: OCI manifest layer statistics unit tests
        run: node --test scripts/measure-ghcr-pair.check.mjs

      # P5 source CPU evidence: actual 1k/10k/100k synthetic runs, not real DXF acceptance.
      # Private CAD inputs are never uploaded to GitHub CI.
      - name: DXF outline source benchmark (1k 10k 100k synthetic)
        run: npm run test:outline-benchmark

      # run.mjs treats unresolved Webpack import/export warnings as hard failures.
      # This must run BEFORE browser tests and GHCR promotion.
      - name: Validate timing reporter (#197)
        run: node --test ../.github/scripts/report-playwright-duration.check.mjs

      - name: Production 빌드
        run: npm run build

      - name: Pack reusable standalone build (preserve symlinks)
        run: |
          test -f .next/standalone/server.js
          tar --exclude='.next/cache' -cf "$RUNNER_TEMP/production-build.tar" .next
          tar -tf "$RUNNER_TEMP/production-build.tar" .next/standalone/server.js > /dev/null
      - name: Upload exact-HEAD production build artifact
        uses: actions/upload-artifact@v4
        with:
          name: production-build-${{ github.run_id }}
          path: ${{ runner.temp }}/production-build.tar
          if-no-files-found: error
          retention-days: 1
          overwrite: true

  e2e:
    name: General Chromium E2E (shard ${{ matrix.shard }}/2)
    needs: [scope, quality]
    if: needs.scope.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    defaults:
      run:
        working-directory: src
    env:
      PLAYWRIGHT_JSON_OUTPUT_FILE: /tmp/layoutmanager-general-shard-${{ matrix.shard }}.json
    steps:
      - name: Checkout exact PR revision
        uses: actions/checkout@v4
      - name: Node.js and npm cache
        uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: npm
          cache-dependency-path: src/package-lock.json
      - name: Install frozen dependencies
        run: npm ci
      - name: Generate Prisma Client for isolated test database
        run: npm run db:generate
      - name: Download exact-HEAD production build
        uses: actions/download-artifact@v4
        with:
          name: production-build-${{ github.run_id }}
          path: ${{ runner.temp }}
      - name: Restore standalone build without rebuilding
        run: |
          tar -xf "$RUNNER_TEMP/production-build.tar" -C .
          test -f .next/standalone/server.js
      - name: Playwright Chromium and system dependencies
        run: npx playwright install --with-deps chromium
      - name: General E2E shard ${{ matrix.shard }}/2
        run: npm run test:e2e -- --shard=${{ matrix.shard }}/2 --reporter=dot,json
      - name: Report slow Playwright tests (#197)
        if: always()
        run: node ../.github/scripts/report-playwright-duration.mjs "$PLAYWRIGHT_JSON_OUTPUT_FILE" "General Chromium shard ${{ matrix.shard }}/2"
      - name: Upload Playwright JSON and failure traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-general-${{ matrix.shard }}-${{ github.run_attempt }}
          path: |
            ${{ env.PLAYWRIGHT_JSON_OUTPUT_FILE }}
            src/test-results/
          if-no-files-found: ignore
          retention-days: 7

  greenfield-e2e:
    name: G7 Greenfield UI E2E (#109)
    needs: [scope, quality]
    if: needs.scope.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: src
    env:
      PLAYWRIGHT_JSON_OUTPUT_FILE: /tmp/layoutmanager-greenfield.json
    steps:
      - name: Checkout exact PR revision
        uses: actions/checkout@v4
      - name: Node.js and npm cache
        uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: npm
          cache-dependency-path: src/package-lock.json
      - name: Install frozen dependencies
        run: npm ci
      - name: Generate Prisma Client for isolated test database
        run: npm run db:generate
      - name: Download exact-HEAD production build
        uses: actions/download-artifact@v4
        with:
          name: production-build-${{ github.run_id }}
          path: ${{ runner.temp }}
      - name: Restore standalone build without rebuilding
        run: |
          tar -xf "$RUNNER_TEMP/production-build.tar" -C .
          test -f .next/standalone/server.js
      - name: Playwright Chromium and system dependencies
        run: npx playwright install --with-deps chromium
      - name: G7 신규설치 최초 관리자 웹 UI E2E (#109)
        run: npx playwright test --config playwright.g7-greenfield.config.ts --reporter=dot,json
      - name: Report slow Playwright tests (#197)
        if: always()
        run: node ../.github/scripts/report-playwright-duration.mjs "$PLAYWRIGHT_JSON_OUTPUT_FILE" "G7 Greenfield"
      - name: Upload Playwright JSON and failure traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-greenfield-${{ github.run_attempt }}
          path: |
            ${{ env.PLAYWRIGHT_JSON_OUTPUT_FILE }}
            src/test-results/
          if-no-files-found: ignore
          retention-days: 7

  runtime-legacy-e2e:
    name: G7 signed runtime and legacy migration E2E
    needs: [scope, quality]
    if: needs.scope.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: src
    steps:
      - name: Checkout exact PR revision
        uses: actions/checkout@v4
      - name: Node.js and npm cache
        uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: npm
          cache-dependency-path: src/package-lock.json
      - name: Install frozen dependencies
        run: npm ci
      - name: Generate Prisma Client for isolated test database
        run: npm run db:generate
      - name: Download exact-HEAD production build
        uses: actions/download-artifact@v4
        with:
          name: production-build-${{ github.run_id }}
          path: ${{ runner.temp }}
      - name: Restore standalone build without rebuilding
        run: |
          tar -xf "$RUNNER_TEMP/production-build.tar" -C .
          test -f .next/standalone/server.js
      - name: Playwright Chromium and system dependencies
        run: npx playwright install --with-deps chromium
      - name: G7 서명 Runtime 로그인·관리·CAD 권한 E2E
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: ${{ runner.temp }}/signed-runtime.json
        run: npx playwright test --config playwright.g7-runtime.config.ts --reporter=dot,json
      - name: Report signed-runtime timing
        if: always()
        run: node ../.github/scripts/report-playwright-duration.mjs "$RUNNER_TEMP/signed-runtime.json" "G7 Signed Runtime"
      - name: Legacy migration E2E 테스트
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: ${{ runner.temp }}/legacy-migration.json
        run: npm run test:master-migration -- --reporter=dot,json
      - name: Report migration timing
        if: always()
        run: node ../.github/scripts/report-playwright-duration.mjs "$RUNNER_TEMP/legacy-migration.json" "Legacy Migration"
      - name: Upload runtime/legacy JSON and failure traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-runtime-legacy-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/signed-runtime.json
            ${{ runner.temp }}/legacy-migration.json
            src/test-results/
          if-no-files-found: ignore
          retention-days: 7

  docker-runtime:
    name: Docker image size, migration and runtime smoke
    needs: scope
    if: needs.scope.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout including baseline revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Read candidate version for inspected image-pair labels (#209)
        id: image-version
        run: python3 -c 'import json,os;v=json.load(open("src/package.json"))["version"];open(os.environ["GITHUB_OUTPUT"],"a").write("version="+v+"\n")'
      - name: Validate tagless and digest image-pair Compose resolution
        shell: bash
        run: |
          set -euo pipefail
          bash -n src/scripts/compose.sh
          GHCR_IMAGE=ghcr.io/planner77/layoutmanager GHCR_MIGRATION_IMAGE= \
            bash src/scripts/compose.sh .env.example config --format json \
            | python3 -c "import json,sys; s=json.load(sys.stdin)['services']; assert s['app']['image']=='ghcr.io/planner77/layoutmanager:latest'; assert s['migrate']['image']=='ghcr.io/planner77/layoutmanager:latest-migrate'"
          if GHCR_IMAGE=ghcr.io/planner77/layoutmanager@sha256:abc GHCR_MIGRATION_IMAGE= \
            bash src/scripts/compose.sh .env.example --print-images; then
            echo "::error::Digest-pinned app unexpectedly accepted without migrator reference"
            exit 1
          fi
      - name: Check Python audit syntax and synthetic regressions before Docker builds (#67)
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile src/scripts/audit_standalone_layers.py src/scripts/test_audit_standalone_layers.py src/scripts/smoke_web_runtime.py src/scripts/smoke_greenfield_runtime.py
          python3 src/scripts/test_audit_standalone_layers.py
          python3 -m py_compile src/scripts/g7-upgrade.py src/scripts/test_g7_upgrade.py src/scripts/smoke_greenfield_wal_readonly.py
          python3 src/scripts/test_g7_upgrade.py
          # #211 single entrypoint: fail PR before Docker build if host policy regresses.
          python3 -m py_compile src/scripts/g7-deploy.py src/scripts/test_g7_deploy.py
          python3 src/scripts/test_g7_deploy.py
      - name: Build pre-change baseline (same source, original Dockerfile)
        if: needs.scope.outputs.baseline == 'true'
        shell: bash
        run: |
          set -euo pipefail
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          if [ -z "$BASE_SHA" ]; then BASE_SHA="$(git rev-parse origin/main)"; fi
          git show "$BASE_SHA:src/Dockerfile" > "$RUNNER_TEMP/issue28-baseline.Dockerfile"
          # The baseline uses the PR's CURRENT source, including the newly added
          # logger relative import. Supply ONLY this required one-file closure to
          # the comparison Dockerfile; otherwise baseline migrator cannot start.
          # Do not bypass its import smoke, size comparison or native DB checks.
          python3 - "$RUNNER_TEMP/issue28-baseline.Dockerfile" <<'PY'
          from pathlib import Path
          import re
          import sys
          baseline = Path(sys.argv[1])
          source = baseline.read_bytes()
          anchor = b"COPY --from=builder /app/src/server/logger.ts ./server/logger.ts\n"
          dependency = b"COPY --from=builder /app/src/server/logging/store.ts ./server/logging/store.ts\n"
          stages = list(re.finditer(rb"(?im)^[ \t]*FROM[ \t]+[^\r\n]+(?:\r?\n|$)", source))
          migrators = [i for i, stage in enumerate(stages)
                       if re.search(rb"(?i)[ \t]+AS[ \t]+migrator[ \t]*(?:\r?\n|$)", stage.group())]
          if len(migrators) != 1:
              raise SystemExit("Baseline migrator stage is missing or ambiguous")
          stage_index = migrators[0]
          start = stages[stage_index].start()
          end = stages[stage_index + 1].start() if stage_index + 1 < len(stages) else len(source)
          # A near-match COPY is not a valid closure. It must not be silently
          # accepted or duplicated under a different destination/stage.
          for line in source.splitlines(keepends=True):
              copy = re.match(rb"(?i)^COPY[ \t]+", line.lstrip())
              if b"server/logger.ts" in line and copy and line != anchor:
                  raise SystemExit("Baseline logger COPY is malformed")
              if b"server/logging/store.ts" in line and copy and line != dependency:
                  raise SystemExit("Baseline store COPY is malformed")
          anchors = list(re.finditer(rb"(?m)^" + re.escape(anchor), source))
          if source.count(anchor) != 1 or len(anchors) != 1 or not (start <= anchors[0].start() < end):
              raise SystemExit("Baseline logger package manifest differs from expected source")
          copies = list(re.finditer(rb"(?m)^" + re.escape(dependency), source))
          count = source.count(dependency)
          if count != len(copies) or count > 1 or count == 1 and not (start <= copies[0].start() < end):
              raise SystemExit("Baseline store COPY is duplicate or outside migrator")
          if count == 0:
              position = anchors[0].end()
              baseline.write_bytes(source[:position] + dependency + source[position:])
          PY
          docker buildx build --load --platform linux/amd64 --target runtime -f "$RUNNER_TEMP/issue28-baseline.Dockerfile" -t cad-layout-viewer:baseline .
          docker buildx build --load --platform linux/amd64 --target migrator -f "$RUNNER_TEMP/issue28-baseline.Dockerfile" -t cad-layout-viewer:baseline-migrate .
      # Buildx action supplies authenticated GHA cache parameters; separate target scopes
      # prevent phase1/runtime/migrator cache overwrites. Cache faults are non-fatal.
      - name: Prepare exact Git archive for three release-role builds
        shell: bash
        run: |
          set -euo pipefail
          python3 src/tests/oci/rr1-ci-source.py prepare --out-dir "$RUNNER_TEMP/rr1-release"
      - name: Build phase1 for baseline comparison (when packaging changed)
        if: needs.scope.outputs.baseline == 'true'
        uses: docker/build-push-action@v7
        with:
          context: ${{ runner.temp }}/rr1-release/source
          file: ${{ runner.temp }}/rr1-release/source/src/Dockerfile
          target: phase1
          platforms: linux/amd64
          load: true
          tags: cad-layout-viewer:phase1
          cache-from: type=gha,scope=layoutmanager-phase1
          cache-to: type=gha,scope=layoutmanager-phase1,mode=max,ignore-error=true
      - name: Build standalone web runtime with GHA cache
        uses: docker/build-push-action@v7
        with:
          context: ${{ runner.temp }}/rr1-release/source
          file: ${{ runner.temp }}/rr1-release/source/src/Dockerfile
          target: runtime
          platforms: linux/amd64
          load: true
          tags: cad-layout-viewer:ci
          labels: |
            org.opencontainers.image.source=https://github.com/planner77/layoutManager
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.image-version.outputs.version }}
          cache-from: type=gha,scope=layoutmanager-runtime
          cache-to: type=gha,scope=layoutmanager-runtime,mode=max,ignore-error=true
      - name: Build dedicated migrator with GHA cache
        uses: docker/build-push-action@v7
        with:
          context: ${{ runner.temp }}/rr1-release/source
          file: ${{ runner.temp }}/rr1-release/source/src/Dockerfile
          target: migrator
          platforms: linux/amd64
          load: true
          tags: cad-layout-viewer:ci-migrate
          labels: |
            org.opencontainers.image.source=https://github.com/planner77/layoutManager
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.image-version.outputs.version }}
          cache-from: type=gha,scope=layoutmanager-migrator
          cache-to: type=gha,scope=layoutmanager-migrator,mode=max,ignore-error=true
      # #225/B2-B verify the actual OCI target, not only TS functions.
      - name: Build standalone CPU Worker with GHA cache
        uses: docker/build-push-action@v7
        with:
          context: ${{ runner.temp }}/rr1-release/source
          file: ${{ runner.temp }}/rr1-release/source/src/Dockerfile
          target: cpu-worker
          platforms: linux/amd64
          load: true
          tags: cad-layout-viewer:ci-cpu-worker
          labels: |
            org.opencontainers.image.source=https://github.com/planner77/layoutManager
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.image-version.outputs.version }}
          cache-from: type=gha,scope=layoutmanager-cpu-worker
          cache-to: type=gha,scope=layoutmanager-cpu-worker,mode=max,ignore-error=true
      - name: Verify CPU Worker nonroot/offline fail-closed image
        shell: bash
        run: |
          set -euo pipefail
          test "$(docker image inspect cad-layout-viewer:ci-cpu-worker --format '{{ index .Config.Labels "com.planner77.g7.image-role" }}')" = cpu-worker
          docker run --rm --entrypoint sh cad-layout-viewer:ci-cpu-worker -c '
            test "$(id -u)" = 10001
            test -f scripts/scene-cpu-worker.ts
            test -f node_modules/.bin/tsx
            node -e "const Db=require(\"better-sqlite3\");new Db(\":memory:\").close()"
          '
          if docker run --rm --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges --pids-limit 64 --memory 768m --cpus 1 \
            --tmpfs /tmp:rw,nosuid,nodev,noexec,size=96m,uid=10001,gid=10001 \
            -e G7_GREENFIELD_MODE=true -e G7_GREENFIELD_AUTOMATED=true \
            -e CAD_STORAGE_BACKEND=local -e SCENE_AUTO_BUILD_ENABLED=false \
            -e SCENE_CPU_WORKER_ENABLED=false --entrypoint node \
            cad-layout-viewer:ci-cpu-worker --import tsx scripts/scene-cpu-worker.ts --once; then
            echo "::error::CPU Worker accepted an unapproved release gate"
            exit 1
          fi
      # RR1 verifies actual Registry V2 manifest/config/layer bytes and pulls
      # all three roles by digest from a unique loopback-only registry. The
      # source context above is one exact Git archive, not a dirty checkout.
      - name: Verify immutable three-role OCI registry roundtrip
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile src/tests/oci/rr1-ci-source.py src/tests/oci/rr1-registry-proof.py
          python3 src/tests/oci/rr1-image-identity.test.py
          python3 src/tests/oci/rr1-ci-source.py finish --out-dir "$RUNNER_TEMP/rr1-release"
          docker pull registry@sha256:a3d8aaa63ed8681a604f1dea0aa03f100d5895b6a58ace528858a7b332415373
          python3 src/tests/oci/rr1-registry-proof.py \
            --build-receipt "$RUNNER_TEMP/rr1-release/rr1-input.json" \
            --output-receipt "$RUNNER_TEMP/rr1-release/rr1-registry-receipt.json" \
            --retain-for-r2
      # #225: true OCI (same local cpu-worker target), not a mock child process.
      # Uses only a test-run-unique Docker volume and has a mandatory cleanup trap.
      - name: Verify disposable CPU Worker OCI security, converter faults and restore
        shell: bash
        run: |
          set -euo pipefail
          bash -n src/tests/oci/scene-cpu-worker-proof.sh
          node --check src/tests/oci/scene-cpu-proof-fixture.mjs
          node --check src/tests/oci/scene-cpu-converter-inspector.mjs
          bash src/tests/oci/scene-cpu-worker-proof.sh
      # #225/P1-D: actual G7 App HTTP + distinct CPU OCI + fresh authenticated Chromium.
      # Uses only a new CI-owned Docker volume and locally built images;
      # never pulls/publishes GHCR or touches an operational .env/volume.
      - name: Setup Node for isolated P1-D Chromium
        uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: npm
          cache-dependency-path: src/package-lock.json
      - name: Install Playwright test client for P1-D
        shell: bash
        run: |
          set -euo pipefail
          cd src
          npm ci
          npx playwright install --with-deps chromium
      - name: P1-D signed HTTP upload to OCI Worker and fresh Viewer browser
        shell: bash
        run: |
          set -euo pipefail
          bash -n src/tests/oci/scene-p1d-journey.sh
          node --check src/tests/oci/scene-p1d-probe.mjs
          bash src/tests/oci/scene-p1d-journey.sh
      - name: Measure 3 image sizes, layers and directories
        if: needs.scope.outputs.baseline == 'true'
        run: bash src/scripts/measure-images.sh cad-layout-viewer:baseline cad-layout-viewer:phase1 cad-layout-viewer:ci "$GITHUB_STEP_SUMMARY"
      - name: Verify web layer SHA, native and transition-only size saving (#67)
        if: needs.scope.outputs.baseline == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 src/scripts/audit_standalone_layers.py cad-layout-viewer:baseline cad-layout-viewer:ci "$GITHUB_STEP_SUMMARY"
      - name: Measure migrator baseline vs dedicated dependency closure
        if: needs.scope.outputs.baseline == 'true'
        run: bash src/scripts/measure-migrator.sh cad-layout-viewer:baseline-migrate cad-layout-viewer:ci-migrate "$GITHUB_STEP_SUMMARY"
      - name: Verify migrator packaged files and native dependencies
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --entrypoint sh cad-layout-viewer:ci-migrate -c '
            test "$(id -u)" = 10001
            for f in node_modules/.bin/prisma node_modules/.bin/tsx generated/prisma/client.ts prisma.config.ts prisma/migrations server/db.ts scripts/deploy.ts server/logger.ts server/logging/store.ts server/upload-error-catalog.ts; do
              test -e "$f" || { echo "Missing required migrator file: $f"; exit 1; }
            done
            for f in .next public tests server/repositories node_modules/next node_modules/react node_modules/react-dom node_modules/eslint node_modules/vitest node_modules/@playwright/test node_modules/dxf-viewer node_modules/three-dxf-viewer; do
              test ! -e "$f" || { echo "Unexpected migrator file: $f"; exit 1; }
            done
            node -e "const Db=require(\"better-sqlite3\");new Db(\":memory:\").close()"
            node --import tsx --input-type=module -e "import { writeLog } from \"./server/logger.ts\"; if (typeof writeLog !== \"function\") process.exit(1)"
          '

      - name: Validate nonroot web native SQLite and packaged Prisma client (#67)
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --entrypoint sh cad-layout-viewer:ci -c '
            test "$(id -u)" = 10001
            test -f /app/src/node_modules/better-sqlite3/build/Release/better_sqlite3.node
            node -e "const Db=require(\"better-sqlite3\");new Db(\":memory:\").close()"
            test -f /app/src/server.js
          '
      - name: Confirm failed migration is nonzero before app startup
        run: |
          if docker run --rm -e DATABASE_URL=file:/proc/cad.sqlite -e CAD_STORAGE_PATH=/data/cad cad-layout-viewer:ci-migrate; then
            echo "::error::Unwritable database path unexpectedly passed migration"
            exit 1
          fi
      - name: Reject invalid migrations in a disposable database
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          mkdir -p "$tmp/migrations" "$tmp/data/db" "$tmp/data/cad"
          cp -R src/prisma/migrations/. "$tmp/migrations/"
          mkdir "$tmp/migrations/99999999999999_invalid_ci"
          printf '%s\n' 'THIS IS NOT VALID SQL;' > "$tmp/migrations/99999999999999_invalid_ci/migration.sql"
          chmod 755 "$tmp"
          chmod -R a+rX "$tmp/migrations"
          chmod -R a+rwX "$tmp/data"
          if docker run --rm \
            --mount "type=bind,source=$tmp/migrations,target=/app/src/prisma/migrations,readonly" \
            --mount "type=bind,source=$tmp/data,target=/data" \
            -e DATABASE_URL=file:/data/db/cad.sqlite \
            cad-layout-viewer:ci-migrate; then
            echo "::error::Deliberately invalid migration unexpectedly succeeded"
            exit 1
          fi
          # Above uses a disposable CI directory; never a production DB/CAD volume.
      # A newly started Node server can reset a connection before its listener is ready.
      # curl --retry-connrefused alone does not retry exit 56; retry-all-errors covers it.
      - name: Validate #107 isolated G5 PROD and DEV preview configurations
        shell: bash
        run: |
          set -euo pipefail
          # Config-only: never starts the G5 containers, touches production data or activates auth.
          docker compose -f src/deploy/g5/compose.preview.yml --profile g5-prod config --quiet
          docker compose -f src/deploy/g5/compose.preview.yml --profile g5-dev config --quiet

      # Do not grant a private GHCR package token to a fork.
      # The published 0.56 App/Migrator are mandatory, not replaceable by a rebuilt source.
      - name: Authenticate GHCR for immutable 0.56 release smoke (#209)
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Upgrade real 0.56 Greenfield image with preserved DB and CAD (#209)
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(python3 -c 'import json;print(json.load(open("src/package.json"))["version"])')"
          # Old immutable release read only; never publish or retag a registry image.
          for old_tag in 0.56.0 0.56.0-migrate; do
            if ! docker pull "ghcr.io/planner77/layoutmanager:${old_tag}"; then
              echo "::error::GHCR ${old_tag} unavailable: confirm immutable tag was published and grant this repository Actions read access to its package."
              exit 1
            fi
          done
          docker tag cad-layout-viewer:ci "cad-layout-viewer:${VERSION}"
          docker tag cad-layout-viewer:ci-migrate "cad-layout-viewer:${VERSION}-migrate"
          python3 src/scripts/smoke_greenfield_upgrade.py \
            --old-app ghcr.io/planner77/layoutmanager:0.56.0 \
            --old-migrator ghcr.io/planner77/layoutmanager:0.56.0-migrate \
            --app "cad-layout-viewer:${VERSION}" --migrator "cad-layout-viewer:${VERSION}-migrate" \
            --source "${{ github.sha }}"
      # RR2 consumes the retained RR1 digest-pulled triplet and published 0.60
      # pair. These are actual images; no source retag can replace either input.
      - name: RR2 actual OCI upgrade, recovery, Worker and Viewer journey
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile src/tests/oci/rr2-*.py src/tests/oci/test_rr2_cleanup.py
          python3 -m unittest src/tests/oci/test_rr2_cleanup.py
          python3 src/tests/oci/rr2-timeout-probe.py \
            --triplet-receipt "$RUNNER_TEMP/rr1-release/rr1-registry-receipt.json"
          python3 src/tests/oci/rr2-timeout-probe.py --host-helper \
            --triplet-receipt "$RUNNER_TEMP/rr1-release/rr1-registry-receipt.json"
          python3 src/tests/oci/rr2-old-pair.py \
            --output-receipt "$RUNNER_TEMP/rr1-release/rr2-old-pair.json"
          python3 src/tests/oci/rr2-journey.py \
            --old-pair-receipt "$RUNNER_TEMP/rr1-release/rr2-old-pair.json" \
            --new-triplet-receipt "$RUNNER_TEMP/rr1-release/rr1-registry-receipt.json" \
            --output-receipt "$RUNNER_TEMP/rr1-release/rr2-journey.json"
      - name: Clean exact RR2 namespaces and retained RR1 registry
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          failed=0
          old="$RUNNER_TEMP/rr1-release/rr2-old-pair.json"
          new="$RUNNER_TEMP/rr1-release/rr1-registry-receipt.json"
          for receipt in data/release-proof/rr2-*/receipt.json; do
            [ -f "$receipt" ] || continue
            if [[ "$(basename "$(dirname "$receipt")")" =~ ^rr2-timeout-[0-9a-f]{16}$ ]]; then
              if ! python3 src/tests/oci/rr2-timeout-probe.py --cleanup-receipt "$receipt"; then
                failed=1
              fi
              continue
            fi
            if [[ ! "$(basename "$(dirname "$receipt")")" =~ ^rr2-[0-9a-f]{16}$ ]]; then
              failed=1
              continue
            fi
            if ! RR2_OLD_PAIR_RECEIPT="$old" RR2_CURRENT_TRIPLET_RECEIPT="$new" \
              python3 src/tests/oci/rr2-recovery-proof.py cleanup --receipt "$receipt"; then
              failed=1
            fi
          done
          if [ -f "$new" ]; then
            if ! python3 src/tests/oci/rr1-registry-proof.py --cleanup-receipt "$new"; then
              failed=1
            fi
          fi
          exit "$failed"
      - name: Readonly stopped and active WAL inspection and recovery (#210 P2)
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(python3 -c 'import json;print(json.load(open("src/package.json"))["version"])')"
          python3 src/scripts/smoke_greenfield_wal_readonly.py \
            --migrator "cad-layout-viewer:${VERSION}-migrate" --version "$VERSION" \
            --source "${{ github.sha }}"
      - name: Compose Greenfield first run, Admin, CAD, restart persistence
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(python3 -c 'import json;print(json.load(open("src/package.json"))["version"])')"
          export GHCR_IMAGE="cad-layout-viewer:${VERSION}"
          export GHCR_MIGRATION_IMAGE="cad-layout-viewer:${VERSION}-migrate"
          export G7_RELEASE_SOURCE_COMMIT="${{ github.sha }}"
          export CAD_DATA_VOLUME_NAME="cad-layout-viewer-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "CAD_DATA_VOLUME_NAME=$CAD_DATA_VOLUME_NAME" >> "$GITHUB_ENV"
          docker tag cad-layout-viewer:ci "$GHCR_IMAGE"
          docker tag cad-layout-viewer:ci-migrate "$GHCR_MIGRATION_IMAGE"
          docker compose --env-file .env.example -f src/docker-compose.yml config --quiet
          # #211: read-only new-volume check and explicitly approved fresh install.
          python3 src/scripts/g7-deploy.py .env.example status --json > "$RUNNER_TEMP/g7-211-before.json"
          python3 - "$RUNNER_TEMP/g7-211-before.json" <<'PY'
          import json,sys
          data=json.load(open(sys.argv[1]))
          assert data['decision']=='FRESH_INSTALL' and data['volumeState']=='ABSENT', data
          PY
          python3 src/scripts/g7-deploy.py .env.example plan --json > "$RUNNER_TEMP/g7-211-plan.json"
          G7_PLAN="$(python3 -c 'import json,os;print(json.load(open(os.environ["RUNNER_TEMP"]+"/g7-211-plan.json"))["planId"])')"
          python3 src/scripts/g7-deploy.py .env.example execute --approve-plan "$G7_PLAN" --json > "$RUNNER_TEMP/g7-211-execute.json"
          python3 - "$RUNNER_TEMP/g7-211-execute.json" <<'PY'
          import json,sys
          assert json.load(open(sys.argv[1]))['state']=='FRESH_INSTALLED'
          PY
          curl --fail --silent --show-error --retry 40 --retry-delay 3 --retry-connrefused --retry-all-errors --connect-timeout 3 --max-time 10 http://localhost:3000/api/health
          # The one-time code is synthetic; never print it in Actions output.
          CODE="$(docker compose --env-file .env.example -f src/docker-compose.yml exec -T app cat /data/db/first-admin.code)"
          G7_CI_FIRST_SETUP_CODE="$CODE" python3 src/scripts/smoke_greenfield_runtime.py create http://localhost:3000 "$RUNNER_TEMP/issue109-crud.json"
          unset CODE
          curl --fail http://localhost:3000/fonts/NanumGothic-Regular.ttf --output /dev/null
          curl --fail http://localhost:3000/fonts/CadKorean.typeface.json --output /dev/null
          curl --fail http://localhost:3000/libredwg/wasm/libredwg-web.wasm --output /dev/null
          docker compose --env-file .env.example -f src/docker-compose.yml stop app
          # #211: stopped same-release App needs a separate approved start plan.
          python3 src/scripts/g7-deploy.py .env.example plan --operation start --json > "$RUNNER_TEMP/g7-211-start.json"
          G7_START_PLAN="$(python3 -c 'import json,os;print(json.load(open(os.environ["RUNNER_TEMP"]+"/g7-211-start.json"))["planId"])')"
          python3 src/scripts/g7-deploy.py .env.example start --approve-plan "$G7_START_PLAN" --json > "$RUNNER_TEMP/g7-211-start-result.json"
          python3 - "$RUNNER_TEMP/g7-211-start-result.json" <<'PY'
          import json,sys
          assert json.load(open(sys.argv[1]))['state']=='STARTED_VERIFIED_IMAGE'
          PY
          docker compose --env-file .env.example -f src/docker-compose.yml stop app
          docker compose --env-file .env.example -f src/docker-compose.yml up --no-build --force-recreate migrate
          docker compose --env-file .env.example -f src/docker-compose.yml up -d --no-build app
          curl --fail --silent --show-error --retry 40 --retry-delay 3 --retry-connrefused --retry-all-errors --connect-timeout 3 --max-time 10 http://localhost:3000/api/health
          python3 src/scripts/smoke_greenfield_runtime.py verify http://localhost:3000 "$RUNNER_TEMP/issue109-crud.json"
      - name: Dump Docker diagnostics and stop without deleting volume
        if: always()
        shell: bash
        env:
          GHCR_IMAGE: cad-layout-viewer:ci
          GHCR_MIGRATION_IMAGE: cad-layout-viewer:ci-migrate
        run: |
          docker compose --env-file .env.example -f src/docker-compose.yml ps || true
          docker compose --env-file .env.example -f src/docker-compose.yml logs --tail 80 || true
          docker compose --env-file .env.example -f src/docker-compose.yml down || true


  a2-cpu-probe:
    # Experimental technical GO gate ONLY. No production worker or GHCR image.
    # Scope to the independent A2 branch; do not tax unrelated PR CI.
    name: '#218 P1-A2 CPU-only Debian/headless synthetic proof'
    needs: scope
    if: ${{ github.event_name == 'pull_request' && startsWith(github.head_ref, 'feat/218-a2-') && needs.scope.outputs.full == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout exact PR revision
        uses: actions/checkout@v4
      - name: Set up Node for A2 discovery
        uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: npm
          cache-dependency-path: src/package-lock.json
      - name: Install frozen A2 discovery dependencies
        working-directory: src
        run: npm ci
      - name: Check actual Playwright A2 discovery before image build
        run: |
          node src/tests/a2/check-discovery.mjs --check
          node src/tests/a2/check-parity-discovery.mjs --check
          node --test src/tests/a2/process-safety.test.mjs
          node --test src/tests/a2/sandbox-profile.test.mjs
      - name: Build disposable Debian/Chromium/Node proof image (not GHCR)
        shell: bash
        run: |
          set -euo pipefail
          docker build --platform linux/amd64 -f src/tests/a2/Dockerfile -t layoutmanager-a2-proof:ci .
      - name: Verify UID10001 without network or site/production mounts
        shell: bash
        run: |
          set -euo pipefail
          observed="$(docker run --rm --network none --user 10001:10001 \
            --entrypoint id layoutmanager-a2-proof:ci -u)"
          test "$observed" = 10001
      - name: Execute fresh-container P0, required A2 and live Adapter parity
        shell: bash
        run: |
          set -euo pipefail
          # CI #539: after five P0 tests, the same cgroup OOM-killed the
          # Playwright worker during the full A2 test. Two *separate* containers
          # retain all original resource/security limits and avoid cumulative
          # browser/Node memory from diagnostics contaminating acceptance.
          report="$RUNNER_TEMP/a2-proof"
          mkdir -p "$report"
          failed=0
          for phase in p0 required parity; do
            name="layoutmanager-a2-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$phase"
            mkdir -p "$report/$phase"
            # Use the exact selectors validated by Playwright discovery above.
            test_config='tests/a2/playwright.config.ts'
            if [[ "$phase" == "parity" ]]; then
              test_config='tests/a2/parity.playwright.config.ts'
              grep_filter='F0[1-5]'
            else
              grep_filter="$(node src/tests/a2/check-discovery.mjs --selector "$phase")"
            fi
            echo "## A2 isolated phase $phase (all selected tests required)"
            docker run -d --init --name "$name" \
              --network none --read-only --user 10001:10001 \
              --cpus 2 --memory 1536m --memory-swap 1536m --pids-limit 256 \
              --shm-size 256m --cap-drop ALL --security-opt no-new-privileges \
              --tmpfs /tmp:rw,nosuid,nodev,size=512m,mode=1777 \
              layoutmanager-a2-proof:ci \
              ./node_modules/.bin/playwright test --config "$test_config" \
              --grep "$grep_filter" > "$report/$phase/container-id.txt"
            (
              while [[ "$(docker inspect -f '{{.State.Running}}' "$name" 2>/dev/null || true)" == "true" ]]; do
                # Host-side stats. No docker exec or extra process in the memory
                # limited test cgroup during a possible OOM spike.
                docker stats --no-stream --format '{{json .}}' "$name" >> "$report/$phase/docker-stats.jsonl" 2>/dev/null || true
                sleep 1
              done
            ) &
            sampler=$!
            set +e
            exit_code="$(timeout --signal=TERM --kill-after=10s 15m docker wait "$name")"
            wait_rc=$?
            set -e
            if [[ "$wait_rc" -ne 0 ]]; then docker kill "$name" >/dev/null 2>&1 || true; fi
            kill "$sampler" >/dev/null 2>&1 || true
            wait "$sampler" 2>/dev/null || true
            docker logs "$name" 2>&1 | tee "$report/$phase/playwright.log"
            docker inspect --format '{"oomKilled":{{.State.OOMKilled}},"exitCode":{{.State.ExitCode}},"status":"{{.State.Status}}","pid":{{.State.Pid}}}' \
              "$name" | tee "$report/$phase/docker-inspect.json"
            printf 'phase=%s wait_rc=%s container_exit=%s\n' \
              "$phase" "$wait_rc" "$exit_code" | tee "$report/$phase/exit-status.txt"
            if [[ "$wait_rc" -ne 0 || "$exit_code" != "0" ]]; then
              echo "::error::A2 phase $phase failed; this must block Verify"
              failed=1
            fi
            # Remove this exact disposable container only after evidence capture.
            docker rm -f "$name" >/dev/null 2>&1 || true
          done
          if [[ "$failed" -ne 0 ]]; then exit 1; fi
      - name: Verify real isolated process faults, cleanup and fresh conversion
        working-directory: src
        env:
          A2_PROOF_IMAGE: layoutmanager-a2-proof:ci
          A2_PROCESS_REPORT_DIR: ${{ runner.temp }}/a2-proof/process-safety
          A2_PROCESS_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: node tests/a2/process-safety.mjs
      - name: Record strict sandbox research evidence (NO-GO, expected WebGL restore block)
        working-directory: src
        env:
          A2_PROOF_IMAGE: layoutmanager-a2-proof:ci
          A2_SANDBOX_REPORT_DIR: ${{ runner.temp }}/a2-proof/sandbox
          A2_SANDBOX_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: node tests/a2/sandbox-probe.mjs
      - name: Archive synthetic-only A2 phases and resource/Crash evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a2-cpu-proof-${{ github.run_id }}
          path: ${{ runner.temp }}/a2-proof/
          if-no-files-found: warn
          retention-days: 7
      - name: Kill orphan proof container only (never touch production volumes)
        if: always()
        shell: bash
        run: |
          for phase in p0 required parity; do
            docker rm -f "layoutmanager-a2-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$phase" >/dev/null 2>&1 || true
          done
          # Only containers bearing this exact run/attempt's test label.
          mapfile -t process_containers < <(docker ps -aq --filter "label=io.layoutmanager.a2-process-run=$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT")
          if (( ${#process_containers[@]} )); then
            docker rm -f "${process_containers[@]}" >/dev/null 2>&1 || true
          fi
          mapfile -t sandbox_containers < <(docker ps -aq --filter "label=io.layoutmanager.a2-sandbox-probe=$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT")
          if (( ${#sandbox_containers[@]} )); then
            docker rm -f "${sandbox_containers[@]}" >/dev/null 2>&1 || true
          fi

  verify:
    # Keep the historical required-check name. Jobs may skip only for verified docs-only PRs.
    name: Typecheck, lint, test, build, E2E
    if: always()
    needs: [scope, quality, e2e, greenfield-e2e, runtime-legacy-e2e, docker-runtime, a2-cpu-probe]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SCOPE_RESULT: ${{ needs.scope.result }}
      FULL: ${{ needs.scope.outputs.full }}
      QUALITY_RESULT: ${{ needs.quality.result }}
      GENERAL_RESULT: ${{ needs.e2e.result }}
      GREENFIELD_RESULT: ${{ needs.greenfield-e2e.result }}
      RUNTIME_LEGACY_RESULT: ${{ needs.runtime-legacy-e2e.result }}
      DOCKER_RESULT: ${{ needs.docker-runtime.result }}
      A2_RESULT: ${{ needs.a2-cpu-probe.result }}
      A2_REQUIRED: ${{ github.event_name == 'pull_request' && startsWith(github.head_ref, 'feat/218-a2-') && needs.scope.outputs.full == 'true' }}
    steps:
      - name: Require every applicable validation gate (#197)
        shell: bash
        run: |
          set -euo pipefail
          echo "## PR CI required gate" >> "$GITHUB_STEP_SUMMARY"
          if [[ "$SCOPE_RESULT" != "success" ]]; then
            echo "::error::Scope classification failed; CI must not pass"
            exit 1
          fi
          for pair in "quality:$QUALITY_RESULT" "general-e2e:$GENERAL_RESULT" \
            "greenfield-e2e:$GREENFIELD_RESULT" "runtime-legacy-e2e:$RUNTIME_LEGACY_RESULT" \
            "docker-runtime:$DOCKER_RESULT"; do
            name="${pair%%:*}"
            result="${pair#*:}"
            echo "- $name: $result" >> "$GITHUB_STEP_SUMMARY"
            if [[ "$FULL" == "false" ]]; then
              [[ "$result" == "skipped" ]] || { echo "::error::$name unexpectedly ran on docs-only PR"; exit 1; }
            elif [[ "$FULL" == "true" ]]; then
              [[ "$result" == "success" ]] || { echo "::error::Required $name did not succeed"; exit 1; }
            else
              echo "::error::Unknown scope decision"; exit 1
            fi
          done
          # The dedicated A2 branch must prove its additional CPU job; SKIP is never GO.
          if [[ "$A2_REQUIRED" == "true" ]]; then
            [[ "$A2_RESULT" == "success" ]] || { echo "::error::P1-A2 CPU-only validation did not succeed"; exit 1; }
          else
            [[ "$A2_RESULT" == "skipped" ]] || { echo "::error::A2 test unexpectedly ran outside its gate"; exit 1; }
          fi
          echo "- #218 A2 CPU-only: $A2_RESULT (required=$A2_REQUIRED)" >> "$GITHUB_STEP_SUMMARY"
          if [[ "$FULL" == "false" ]]; then
            echo "- Verified markdown-only: full application suite not required." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- All mandatory application, browser and Docker checks succeeded." >> "$GITHUB_STEP_SUMMARY"
          fi
