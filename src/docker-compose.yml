# Issue #109: ONE ordinary Compose command installs an empty G7 database.
# An existing/legacy volume is NEVER deleted, migrated, adopted or backfilled.
# docker compose --env-file .env -f src/docker-compose.yml up -d --pull always
name: cad-layout-viewer

x-g7-identity: &g7-identity
  G7_GREENFIELD_MODE: "true"
  G7_GREENFIELD_AUTOMATED: "true"
  DATABASE_URL: file:/data/db/cad.sqlite
  CAD_STORAGE_PATH: /data/cad
  CAD_STORAGE_BACKEND: local
  G7_DEPLOY_APP_IMAGE: "${GHCR_IMAGE:-cad-layout-viewer:local}"
  G7_DEPLOY_MIGRATOR_IMAGE: "${GHCR_MIGRATION_IMAGE:-cad-layout-viewer:local-migrate}"
  G7_RELEASE_SOURCE_COMMIT: "${G7_RELEASE_SOURCE_COMMIT:-}"

services:
  migrate:
    image: "${GHCR_MIGRATION_IMAGE:-cad-layout-viewer:local-migrate}"
    build:
      context: ..
      dockerfile: src/Dockerfile
      target: migrator
    restart: "no"
    entrypoint: [node, --import, tsx, scripts/g7-greenfield.ts]
    command: [auto]
    environment:
      <<: *g7-identity
      NODE_ENV: production
      G7_AUTH_ENABLED: "false"
      G7_CAD_WRITE_CUTOVER_ENABLED: "false"
      G7_GREENFIELD_INSTALL_ACK: CREATE_EMPTY_G7_DATABASE
      LOG_STORE_ENABLED: "${LOG_STORE_ENABLED:-true}"
      LOG_SOURCE: maintenance
      LOG_RETENTION_DAYS: "${LOG_RETENTION_DAYS:-7}"
      LOG_MAX_TOTAL_MB: "${LOG_MAX_TOTAL_MB:-64}"
      LOG_MAX_FILE_MB: "${LOG_MAX_FILE_MB:-4}"
    volumes:
      - type: volume
        source: cad-layout-viewer-data
        target: /data

  app:
    image: "${GHCR_IMAGE:-cad-layout-viewer:local}"
    build:
      context: ..
      dockerfile: src/Dockerfile
      target: runtime
    depends_on:
      migrate:
        condition: service_completed_successfully
    container_name: cad-layout-viewer-app
    restart: unless-stopped
    ports:
      - target: 3000
        published: "${CAD_HOST_PORT:-3000}"
        host_ip: 0.0.0.0
        protocol: tcp
        name: http
    environment:
      <<: *g7-identity
      NODE_ENV: production
      G7_AUTH_ENABLED: "true"
      G7_CAD_WRITE_CUTOVER_ENABLED: "true"
      G7_RUNTIME_ORIGIN: "${G7_RUNTIME_ORIGIN:-http://localhost:3000}"
      # HTTP is permitted only on an Owner-approved, firewalled internal LAN.
      # Set G7_RUNTIME_ALLOW_HTTP=false when using HTTPS.
      G7_RUNTIME_ALLOW_HTTP: "${G7_RUNTIME_ALLOW_HTTP:-true}"
      MAX_UPLOAD_SIZE_MB: "${MAX_UPLOAD_SIZE_MB:-100}"
      LOG_LEVEL: "${LOG_LEVEL:-info}"
      LOG_FORMAT: "${LOG_FORMAT:-json}"
      LOG_STORE_ENABLED: "${LOG_STORE_ENABLED:-true}"
      LOG_SOURCE: app
      LOG_RETENTION_DAYS: "${LOG_RETENTION_DAYS:-7}"
      LOG_MAX_TOTAL_MB: "${LOG_MAX_TOTAL_MB:-64}"
      LOG_MAX_FILE_MB: "${LOG_MAX_FILE_MB:-4}"
    volumes:
      - type: volume
        source: cad-layout-viewer-data
        target: /data
    networks:
      - cad-layout-viewer-network
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  cad-layout-viewer-data:
    # Deliberately different from pre-#109's old cad-layout-viewer-data.
    # A named volume is persistent. Use a NEW unused name for each fresh site.
    name: "${CAD_DATA_VOLUME_NAME:-cad-layout-viewer-greenfield-install-v1}"

networks:
  cad-layout-viewer-network:
    name: cad-layout-viewer-network
    driver: bridge
